# Dagster instance configuration
# Documentation: https://docs.dagster.io/deployment/dagster-instance

# unified storage for runs, event logs, and schedules
storage:
  sqlite:
    base_dir: /app/.dagster_home/history

# logs stored on local filesystem
compute_logs:
  module: dagster.core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /app/.dagster_home/logs

# no parallelism for now
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 11
    dequeue_use_threads: true
    dequeue_num_workers: 11

# Enable run monitoring for better error detection
run_monitoring:
  enabled: true

# disable telemetry
telemetry:
  enabled: false