name: 'ost_linker'
version: '1.0.0'
config-version: 2

profile: 'ost_linker'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  ost_linker:
    # Config for all models
    staging:
      +materialized: table
      +schema: github
    prod:
      +materialized: table
      +schema: github
    pivot:
      +materialized: table
      +schema: github
    