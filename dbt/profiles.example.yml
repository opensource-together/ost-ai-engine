ost_linker:
  target: local # Default target
  outputs:
    # Local
    local:
      type: postgres
      host: localhost
      user: localuser
      password: localpwd
      port: 7777
      dbname: localdb
      schema: public
      threads: 4

    # Docker
    docker:
      type: postgres
      host: dbhost
      user: dbuser
      password: dbpwd
      port: 5432
      dbname: dbdb
      schema: public
      threads: 4
