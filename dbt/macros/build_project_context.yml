version: 2

macros:
  - name: build_project_context
    description: >
      Generates a structured Markdown context string for projects, optimized for LLM/embedding consumption.
      Outputs sections like ## Title, ## Description, skipping empty fields by default.
    arguments:
      - name: fields
        type: list
        description: "List of tuples [('Label', 'column_name'), ...] defining sections"
      - name: skip_empty
        type: boolean
        description: "If true, omit sections with empty/null values (default: true)"
