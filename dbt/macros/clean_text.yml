version: 2

macros:
  - name: clean_text
    description: >
      Cleans raw text (README, descriptions) for LLM context.
      Removes code blocks, HTML tags, URLs, emojis, long strings, and normalizes whitespace.
      Truncates to max_length for embedding models.
    arguments:
      - name: column_name
        type: string
        description: "Column containing raw text to clean"
      - name: max_length
        type: integer
        description: "Max character length after cleaning (default: 8000)"
