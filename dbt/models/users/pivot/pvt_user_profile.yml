
version: 2

models:
  - name: pvt_user_profile
    description: >
      Pivot model aggregating comprehensive user profile data by joining user details with their associated tech stacks, domains, and categories.
      Includes a generated 'context' field formatted for RAG embedding.
    columns:
      - name: id
        description: User ID
      - name: context
        description: Aggregated context string for embedding generation
      - name: tech_stacks
        description: Comma-separated list of tech stacks
      - name: domains
        description: Comma-separated list of domains
      - name: categories
        description: Comma-separated list of categories
