version: 2

models:
  - name: pvt_public_project
    description: "Prepares clean, truncated text context for embedding generation by removing formatting artifacts."
    columns:
      - name: id
        description: Project UUID
        tests: [unique, not_null]
      - name: context
        description: Cleaned context (no URLs, code blocks, emojis)
        tests: [not_null]
      - name: created_at
        description: Timestamp
