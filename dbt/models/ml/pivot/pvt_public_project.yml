version: 2

models:
  - name: pvt_public_project
    description: Cleans context using clean_text macro for embedding ingestion.
    columns:
      - name: id
        description: Project UUID
        tests: [unique, not_null]
      - name: context
        description: Cleaned context (no URLs, code blocks, emojis)
        tests: [not_null]
      - name: created_at
        description: Timestamp
