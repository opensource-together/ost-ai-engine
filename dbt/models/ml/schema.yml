version: 2

models:
  - name: stg_public_project
    description: "Staging model sourcing public projects with aggregated metadata."
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: title
      - name: categories
      - name: domains
      - name: tech_stack

  - name: raw_project
    description: "ML model containing the generated context for embedding."
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: context
        description: "Concatenated rich text context."
        tests:
          - not_null
