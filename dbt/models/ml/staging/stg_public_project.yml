version: 2

models:
  - name: stg_public_project
    description: "Aggregates project metadata (Title, Description, Topics) into a structured markdown-like text block."
    columns:
      - name: id
        description: Project UUID
        tests: [unique, not_null]
      - name: context
        description: Structured context (## sections for Title, Description, Categories, etc.)
        tests: [not_null]
      - name: created_at
        description: Generation timestamp
