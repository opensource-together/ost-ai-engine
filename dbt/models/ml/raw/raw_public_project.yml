version: 2

models:
  - name: raw_public_project
    description: Aggregates public projects with categories, domains, tech stacks, and readme.
    columns:
      - name: id
        description: Project UUID
        tests: [unique, not_null]
      - name: title
        description: Project title
      - name: description
        description: Project description
      - name: repoUrl
        description: GitHub repository URL
      - name: categories
        description: Comma-separated categories
      - name: domains
        description: Comma-separated domains
      - name: tech_stack
        description: Comma-separated tech stacks
      - name: readme
        description: README content from GitHub
