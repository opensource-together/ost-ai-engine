version: 2

models:
  - name: raw_public_project
    description: Generates structured context for public projects using build_project_context.
    columns:
      - name: id
        description: Project UUID
        tests: [unique, not_null]
      - name: context
        description: Structured context (## sections for Title, Description, Categories, etc.)
        tests: [not_null]
      - name: created_at
        description: Generation timestamp
