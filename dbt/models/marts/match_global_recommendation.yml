version: 2

models:
  - name: match_global_recommendation
    description: >
      Generates top global project recommendations based on popularity and recency.
      Filters for trending or published projects and ranks them by update freshness
      and star count. The limit is configurable via var('global_reco_top_n', 20).
    columns:
      - name: project_id
        description: "PK projects"
        tests:
          - unique
          - not_null
      - name: stars
        description: "Total GitHub star count"
      - name: last_synced_at
        description: "Timestamp of the last synchronization"
