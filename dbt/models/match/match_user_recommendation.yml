version: 2

models:
  - name: match_user_recommendation
    description: >
      Calculates personalized recommendations for users by computing cosine similarity
      between user profile embeddings and project embeddings. Returns top 5 matches
      for each user.
    columns:
      - name: user_id
        description: "FK to the user table"
        tests:
          - not_null
      - name: project_id
        description: "FK to the project table"
        tests:
          - not_null
      - name: similarity_score
        description: "Cosine similarity score (range -1 to 1, higher is better)"
      - name: calculated_at
        description: "Timestamp when the recommendation was computed"
