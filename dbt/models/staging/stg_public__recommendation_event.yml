version: 2

models:
  - name: stg_public__recommendation_event
    description: "Staging for public.recommendation_event — captures user clicks/shows for feedback-loop scoring and surface-level analytics."
    columns:
      - name: id
        description: "Primary key"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "User who triggered the event"
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('public', 'user')
                field: id
      - name: project_id
        description: "Project the event refers to"
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('public', 'Project')
                field: id
      - name: event_type
        description: "Enum: SHOWN | CLICKED | DISMISSED | STARRED_AFTER_RECO"
        tests:
          - not_null
          - accepted_values:
              values: ["SHOWN", "CLICKED", "DISMISSED", "STARRED_AFTER_RECO"]
      - name: source
        description: "Reco surface that produced the event (PERSONALIZED | TRENDING | SIMILAR | SEMANTIC_SEARCH)"
        tests:
          - accepted_values:
              values: ["PERSONALIZED", "TRENDING", "SIMILAR", "SEMANTIC_SEARCH"]
              config:
                where: "source is not null"
      - name: rank
        description: "0-indexed position of the project in the reco list at the time of the event"
      - name: context
        description: "Free-form metadata (variant A/B, session_id, etc.)"
      - name: occurred_at
        description: "Event timestamp (server-side)"
        tests:
          - not_null
