version: 2

models:
  - name: int_github_project_enriched
    description: "Intermediate model joining project data with all fetched metadata (readme, topics, languages, detection)."
    columns:
      - name: id
        description: "Unique identifier for the project."
        tests:
          - unique
          - not_null
      - name: name
        description: "Name of the repository."
      - name: readme_content
        description: "Content of the README file."
      - name: fetched_topics
        description: "List of topics fetched from API."
      - name: fetched_languages
        description: "Language breakdown fetched from API."
      - name: language_detected
        description: "Language detected by fastText."
