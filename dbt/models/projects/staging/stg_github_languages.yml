version: 2

models:
  - name: stg_github_languages
    description: >
      Staging model for detailed GitHub language statistics (bytes per language).
    columns:
      - name: id
        description: "Unique record identifier"
        tests:
          - unique
          - not_null
      - name: project_id
        description: "FK to stg_github_project"
        tests:
          - relationships:
              to: ref('stg_github_project')
              field: id
      - name: repo_url
        description: "Repository URL"
      - name: languages
        description: "JSONB object {Language: Bytes}"
      - name: created_at
        description: "Record creation timestamp"
