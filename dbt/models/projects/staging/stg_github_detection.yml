version: 2

models:
  - name: stg_github_detection
    description: "Staging model for GitHub language detection. Deduplicates detection results."
    columns:
      - name: id
        description: "Unique identifier for the record."
        tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to the project."
      - name: repo_url
        description: "URL of the repository."
      - name: language_detected
        description: "Detected language code (e.g. 'en', 'fr')."
      - name: language_confidence
        description: "Confidence score of the detection (0.0 to 1.0)."
      - name: created_at
        description: "Timestamp when the record was created."
