version: 2

models:
  - name: stg_github_project
    description: >
      Staging model for core GitHub project metadata. Cleans and deduplicates raw scraper output,
      ensuring one record per project URL.
    columns:
      - name: id
        description: "Unique identifier (UUID v5 derived from URL)"
        tests:
          - unique
          - not_null
      - name: name
        description: "Repository name"
      - name: description
        description: "Repository description"
      - name: url
        description: "GitHub URL (deduplication key)"
        tests:
          - not_null
      - name: stars
        description: "Star count"
      - name: forks
        description: "Fork count"
      - name: language
        description: "Primary language as reported by GitHub"
      - name: topics
        description: "Raw JSON list of topics"
      - name: created_at
        description: "Record creation timestamp"
      - name: updated_at
        description: "Record update timestamp"
