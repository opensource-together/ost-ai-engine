version: 2

models:
  - name: stg_github_topics
    description: "Staging model for GitHub topics. Deduplicates raw topics data."
    columns:
      - name: id
        description: "Unique identifier for the record."
        tests:
          - unique
          - not_null
      - name: project_id
        description: "Foreign key to the project."
        tests:
          - relationships:
              to: ref('stg_github_project')
              field: id
      - name: repo_url
        description: "URL of the repository."
      - name: topics
        description: "JSON list of topics."
      - name: created_at
        description: "Timestamp when the record was created."
