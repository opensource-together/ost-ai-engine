version: 2

models:
  - name: stg_github_topics
    description: >
      Staging model for GitHub repository topics/tags.
    columns:
      - name: id
        description: "Unique record identifier"
        tests:
          - unique
          - not_null
      - name: project_id
        description: "FK to stg_github_project"
        tests:
          - relationships:
              to: ref('stg_github_project')
              field: id
      - name: repo_url
        description: "Repository URL"
      - name: topics
        description: "JSONB collection of topics"
      - name: created_at
        description: "Record creation timestamp"
