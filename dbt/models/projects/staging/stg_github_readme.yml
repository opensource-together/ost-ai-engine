version: 2

models:
  - name: stg_github_readme
    description: >
      Staging model for GitHub READMEs. Contains the raw markdown content of project READMEs.
    columns:
      - name: id
        description: "Unique record identifier"
        tests:
          - unique
          - not_null
      - name: project_id
        description: "FK to stg_github_project"
        tests:
          - relationships:
              to: ref('stg_github_project')
              field: id
      - name: repo_url
        description: "Repository URL"
      - name: content
        description: "Raw README markdown content"
      - name: created_at
        description: "Record creation timestamp"
