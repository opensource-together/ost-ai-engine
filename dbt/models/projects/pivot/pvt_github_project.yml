version: 2

models:
  - name: pvt_github_project
    description: Pivot table with enriched GitHub projects and LLM-ready context.
    columns:
      - name: id
        description: Project UUID
        tests: [unique, not_null]
      - name: name
        description: Repository name
      - name: description
        description: Repository description
      - name: url
        description: GitHub URL
      - name: stars
        description: Star count
      - name: forks
        description: Fork count
      - name: language
        description: Primary language (coalesced)
      - name: readme
        description: Raw README content
      - name: topics
        description: JSONB array of topics
      - name: languages
        description: JSONB object {lang→bytes}
      - name: language_detected
        description: FastText detected language
      - name: language_confidence
        description: Detection confidence (0-1)
      - name: context
        description: Structured context for embeddings (## Title, Description, Topics, Tech stacks, Readme)
      - name: created_at
        description: Creation timestamp
      - name: updated_at
        description: Last update timestamp
