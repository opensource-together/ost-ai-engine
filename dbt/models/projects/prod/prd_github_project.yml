version: 2

models:
  - name: prd_github_project
    description: "Production model joining project data with generated embeddings."
    columns:
      - name: id
        description: "Unique identifier for the project."
        tests:
          - unique
          - not_null
      - name: name
        description: "Name of the repository."
      - name: description
        description: "Description of the repository."
      - name: url
        description: "URL of the repository."
      - name: stars
        description: "Number of stars."
      - name: forks
        description: "Number of forks."
      - name: language
        description: "Primary language of the repository."
      - name: enrichedData
        description: "JSON object containing enriched metadata."
      - name: embeddingVector
        description: "Vector embedding of the project context."
