version: 2

sources:
  - name: github
    schema: github
    description: "Raw data ingested from GitHub via Go scrapers and Python fetchers."
    tables:
      - name: raw_github_project
        description: "Raw project metadata (stars, forks, description) from Go scraper."
        meta:
          dagster:
            group: ingestion
            asset_key: ["github", "raw_github_project"]
      - name: raw_github_readme
        description: "Raw README markdown content fetched by Go fetcher binary."
        meta:
          dagster:
            group: ingestion
            asset_key: ["github", "raw_github_readme"]
      - name: raw_github_topics
        description: "Raw topics/tags list fetched from GitHub API."
        meta:
          dagster:
            group: ingestion
            asset_key: ["github", "raw_github_topics"]
      - name: raw_github_languages
        description: "Raw language breakdown stats (bytes per language)."
        meta:
          dagster:
            group: ingestion
            asset_key: ["github", "raw_github_languages"]
      - name: int_github_detection
        description: "Language detection results (FastText) generated by Python asset."
        meta:
          dagster:
            group: ingestion
            asset_key: ["github", "int_github_detection"]

  - name: match
    schema: match
    description: "AI/ML Classification and Enrichment results."
    tables:
      - name: project_classification
        description: "LLM-generated classifications (categories, domains) for projects."
        meta:
          dagster:
            group: classification

  - name: ml
    schema: ml
    description: "Machine Learning artifacts (embeddings)."
    tables:
      - name: embd_github_project
        description: "Vector embeddings for projects (generated by Python)."
        meta:
          dagster:
            asset_key: ["ml", "embd_github_project"]
      - name: embd_user
        description: "Vector embeddings for users (generated by Python)."
        meta:
          dagster:
            asset_key: ["ml", "embd_user"]

  - name: public
    schema: public
    description: "Main application schema (Prisma managed)."
    tables:
      - name: user
        description: "Registered users."
      - name: tech_stack
        description: "Reference table for technology stacks."
      - name: user_tech_stack
        description: "Join table linking users to tech stacks."
      - name: user_domain
        description: "Join table linking users to domains."
      - name: Domain
        description: "Reference table for project/user domains (PascalCase)."
      - name: user_categories
        description: "Join table linking users to categories."
      - name: Category
        description: "Reference table for project/user categories (PascalCase)."
      - name: Project
        description: "Public project registry synchronized from scraper data (PascalCase)."
        meta:
          dagster:
            asset_key: ["public", "Project"]
      - name: project_category
        description: "Join table linking projects to categories."
      - name: project_domain
        description: "Join table linking projects to domains."
      - name: project_tech_stack
        description: "Join table linking projects to tech stacks."
      - name: recommendation_event
        description: "User interactions with recommendations (shown, clicked, dismissed, starred_after_reco)."
      - name: project_bookmark
        description: "User bookmarks on projects — strong explicit preference signal."

