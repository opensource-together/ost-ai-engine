version: 2

sources:
  - name: github
    schema: github
    tables:
      - name: raw_github_project
        description: "Raw GitHub project data ingested by Go scraper"
        meta:
          dagster:
            group: ingestion
      - name: raw_github_readme
        description: "Raw README content fetched from GitHub"
        meta:
          dagster:
            group: ingestion
      - name: raw_github_topics
        description: "Raw topics fetched from GitHub"
        meta:
          dagster:
            group: ingestion
      - name: raw_github_languages
        description: "Raw language breakdown fetched from GitHub"
        meta:
          dagster:
            group: ingestion
      - name: int_github_detection
        description: "Intermediate table storing language detection results from fastText (Python asset)"
        meta:
          dagster:
            group: ingestion
      - name: int_github_project
        description: "Intermediate project data enriched by Python"
        meta:
          dagster:
            group: ingestion

  - name: ml
    schema: ml
    tables:
      - name: embd_github_project
        description: "Project embeddings generated by Python"
      - name: embd_user
        description: "User embeddings generated by Python"

  - name: public
    schema: public
    tables:
      - name: user
      - name: tech_stack
      - name: user_tech_stack
      - name: user_domain
      - name: Domain
      - name: user_categories
      - name: Category
      - name: Project
        description: "Public project table synced from scraper"
      - name: project_category
      - name: project_domain
      - name: project_tech_stack
