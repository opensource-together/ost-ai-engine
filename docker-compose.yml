services:
  # ============================================================================
  # MAIN APPLICATION (Dagster + DBT + Go Binaries)
  # ============================================================================
  ost-linker:
    build: .
    container_name: ost-linker-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Dagster UI
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Dagster
      - DAGSTER_HOME=/app/dagster_home
      - DAGSTER_STORAGE_DIR=/app/dagster_home/storage
      - DAGSTER_LOGS_DIR=/app/dagster_home/logs
      # GitHub Tokens for Scraper
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      # Go Binaries (Docker Path)
      - GO_SCRAPER_PATH=/usr/local/bin/ost-scraper
      - GO_FETCHER_PATH=/usr/local/bin/ost-fetcher
      # DBT Config
      - DBT_TARGET=docker
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # LLM / ML
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FASTTEXT_MODEL_PATH=models/lid.176.ftz
    volumes:
      - dagster_data:/app/dagster_home
      # Mount source code for simpler dev loops (optional, remove for prod)
      - ./src:/app/src
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    # Override command to ensure migrations or specific tailored startup if needed
    command: [ "./scripts/init.sh", "dagster", "dev", "-h", "0.0.0.0", "-p", "3000" ]

  # ============================================================================
  # DATABASE (Postgres + PGVector)
  # ============================================================================
  db:
    image: ankane/pgvector:v0.4.1 # Used same version as pyproject.toml requirement
    container_name: ost-linker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  dagster_data:
