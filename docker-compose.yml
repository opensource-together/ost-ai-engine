services:
  # ========================================
  # POSTGRES
  # ========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ost-db
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "7777:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ========================================
  # DAGSTER
  # ========================================
  dagster-daemon:
    build:
      context: .
    container_name: dagster-daemon
    mem_limit: 8g
    shm_size: '4gb'
    env_file:
      - .env
    environment:
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    depends_on:
      - postgres
    volumes:
      - ./config/cfg.py:/app/config/cfg.py
      - ./config/cfg.yaml:/app/config/cfg.yaml
      # Mount the whole dagster package for code changes and local history/logs
      - ./src/:/app/src/
      - ./dbt:/app/dbt
      - ./prisma:/app/prisma
      # Dagster instance storage (matches src/pipeline/dagster.yaml base_dir)
      - ./dagster:/app/dagster
    command: [ "dagster-daemon", "run" ]

  dagster-webserver:
    build:
      context: .
    container_name: dagster-webserver
    mem_limit: 8g
    shm_size: '4gb'
    env_file:
      - .env
    depends_on:
      - postgres
    environment:
      - RUN_MIGRATIONS=true
    ports:
      - "7778:3000"
    volumes:
      - ./config/cfg.py:/app/config/cfg.py
      - ./config/cfg.yaml:/app/config/cfg.yaml
      - ./src/:/app/src
      - ./dbt:/app/dbt
      - ./dagster:/app/dagster
      - ./prisma:/app/prisma
    command: [ "dagster-webserver", "-h", "0.0.0.0", "-p", "3000" ]

volumes:
  pgdata:
