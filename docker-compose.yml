# Compose project name → Docker Desktop shows this as one stack. Use the same
# `org.open-source-together.stack: ost` label on other OST repos so search/filter
# groups them; Docker Desktop does not support a real folder hierarchy across projects.
name: ost-linker

x-ost-labels: &ost-labels
  org.open-source-together.stack: ost
  org.open-source-together.app: linker

# Shared environment variables for Dagster services
x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  DAGSTER_HOME: /app/dagster_home
  DAGSTER_STORAGE_DIR: /app/dagster_home/storage
  DAGSTER_LOGS_DIR: /app/dagster_home/logs
  DAGSTER_PG_URL: ${DAGSTER_PG_URL:-${DATABASE_URL}}
  GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN}
  GO_SCRAPER_PATH: /usr/local/bin/ost-scraper
  GO_FETCHER_PATH: /usr/local/bin/ost-fetcher
  GO_TRENDING_PATH: /usr/local/bin/ost-trending
  DBT_TARGET: docker
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}
  FASTTEXT_MODEL_PATH: models/lid.176.ftz
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

# Share compiled dbt artifacts so the daemon (separate container) can import definitions
# without duplicating a full dbt build; path must match dbt `target-path` + manifest.json.
x-common-volumes: &common-volumes
  - dagster_data:/app/dagster_home
  - dbt_target:/app/dbt/target

services:
  # ============================================================================
  # DAGSTER WEBSERVER (UI + GraphQL API)
  # ============================================================================
  webserver:
    build: .
    container_name: ost-linker-webserver
    restart: unless-stopped
    labels:
      <<: *ost-labels
      org.open-source-together.role: dagster-webserver
      org.open-source-together.description: Dagster UI + GraphQL
    ports:
      - "${DAGSTER_HOST_PORT:-3000}:3000"
    environment:
      <<: *common-env
    volumes: *common-volumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    command: ["./scripts/init.sh", "dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/workspace.yaml"]

  # ============================================================================
  # DAGSTER DAEMON (schedules, sensors, run queue)
  # ============================================================================
  daemon:
    build: .
    container_name: ost-linker-daemon
    restart: unless-stopped
    labels:
      <<: *ost-labels
      org.open-source-together.role: dagster-daemon
      org.open-source-together.description: Schedules, sensors, run queue
    # Image HEALTHCHECK probes :3000 (webserver); daemon has no HTTP port — disable to avoid false "unhealthy".
    healthcheck:
      disable: true
    environment:
      <<: *common-env
      DAGSTER_ROLE: daemon
    volumes: *common-volumes
    depends_on:
      webserver:
        condition: service_healthy
    command: ["./scripts/init.sh", "dagster-daemon", "run", "-w", "/app/workspace.yaml"]

  # ============================================================================
  # REST API (FastAPI — lightweight, read-only)
  # Minimal env: only DATABASE_URL, no Dagster/GitHub/LLM secrets
  # ============================================================================
  api:
    build: .
    container_name: ost-linker-api
    restart: unless-stopped
    labels:
      <<: *ost-labels
      org.open-source-together.role: linker-api
      org.open-source-together.description: FastAPI read-only MCP backend
    ports:
      # Host port only; production keeps default 8000 by leaving LINKER_API_HOST_PORT unset.
      - "${LINKER_API_HOST_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-60}
      # Production: set true together with OST_LINKER_SERVICE_TOKEN (see AGENTS.md).
      OST_LINKER_REQUIRE_SERVICE_TOKEN: ${OST_LINKER_REQUIRE_SERVICE_TOKEN:-false}
      OST_LINKER_SERVICE_TOKEN: ${OST_LINKER_SERVICE_TOKEN:-}
      # Server-side: false hides /docs, /openapi.json, /redoc when using env at container start.
      API_ENABLE_OPENAPI: ${API_ENABLE_OPENAPI:-true}
      DAGSTER_ROLE: api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["./scripts/init.sh", "uvicorn", "src.services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

volumes:
  dagster_data:
  dbt_target:
