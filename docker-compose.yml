version: '3.8'

services:
  # ============================================================================
  # MAIN APPLICATION (Dagster + DBT + Go Binaries)
  # ============================================================================
  ost-linker:
    build: .
    container_name: ost-linker-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Dagster UI
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Dagster home (Docker Path)
      - DAGSTER_HOME=/app/dagster_home
      # GitHub Tokens for Scraper
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      # Go Binaries (Docker Path)
      - GO_SCRAPER_PATH=/usr/local/bin/ost-scraper
      - GO_FETCHER_PATH=/usr/local/bin/ost-fetcher
      # DBT Config
      - DBT_TARGET=docker
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./dagster_home:/app/dagster_home
      # Mount source code for simpler dev loops (optional, remove for prod)
      - ./src:/app/src
      - ./dbt:/app/dbt
    depends_on:
      - db
    # Override command to ensure migrations or specific tailored startup if needed
    command: [ "dagster", "dev", "-h", "0.0.0.0", "-p", "3000" ]

  # ============================================================================
  # DATABASE (Postgres + PGVector)
  # ============================================================================
  db:
    image: ankane/pgvector:v0.4.1 # Used same version as pyproject.toml requirement
    container_name: ost-linker-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
