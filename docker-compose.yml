# ========================================
# DOCKER COMPOSE - OST AI ENGINE
# ========================================
services:
  postgres:
    image: postgres:16
    container_name: ost-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "7777:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dagster-daemon:
    build:
      context: .
    container_name: dagster-daemon
    env_file:
      - .docker.env
    depends_on:
      - postgres
    volumes:
      - ./config/cfg.py:/app/config/cfg.py
      - ./config/cfg.yaml:/app/config/cfg.yaml
      - ./src/dagster/history:/app/src/dagster/history
      - ./src/dagster/compute_logs:/app/src/dagster/compute_logs
    command: ["dagster-daemon", "run"]

  dagster-webserver:
    build:
      context: .
    container_name: dagster-webserver
    env_file:
      - .docker.env
    depends_on:
      - postgres
    ports:
      - "7778:3000"
    volumes:
      - ./config/cfg.py:/app/config/cfg.py
      - ./config/cfg.yaml:/app/config/cfg.yaml
      - ./src/dagster/history:/app/src/dagster/history
      - ./src/dagster/compute_logs:/app/src/dagster/compute_logs
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]

volumes:
  pgdata:
  dagster_history:
  dagster_compute_logs: