networks:
  ost_net:
    driver: bridge

volumes:
  postgres_data:
  dagster_home:

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: ost_ai_engine_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ost_net

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    container_name: ost_ai_engine
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      # PostgreSQL variables declared first
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # DATABASE_URL constructed after PG variables
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DBT_PROJECT_DIR: ${DBT_PROJECT_DIR}
      DBT_PROFILES_DIR: ${DBT_PROFILES_DIR}
      DBT_PROFILE: ${DBT_PROFILE}
      GITHUB_ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN}
      GITLAB_ACCESS_TOKEN: ${GITLAB_ACCESS_TOKEN}
    user: "0:0"
    command: ["bash", "-lc", "mkdir -p /opt/dagster/dagster_home && chown -R appuser:appuser /opt/dagster && exec su -s /bin/bash -c 'cd /app && /app/.venv/bin/dagster-webserver -h 0.0.0.0 -p 3000' appuser"]
    ports:
      - "3000:3000"
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ost_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    container_name: ost_ai_engine_daemon
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      # PostgreSQL variables declared first
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # DATABASE_URL constructed after PG variables
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
    user: "0:0"
    command: ["bash", "-lc", "mkdir -p /opt/dagster/dagster_home && chown -R appuser:appuser /opt/dagster && exec su -s /bin/bash -c 'cd /app && /app/.venv/bin/dagster-daemon run' appuser"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ost_net