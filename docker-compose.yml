# ========================================
# DOCKER COMPOSE - OST AI ENGINE
# ========================================
services:
  postgres:
    image: postgres:latest
    container_name: ost-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "7777:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dagster-daemon:
    build:
      context: .
    container_name: dagster-daemon
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - dagster_history:/app/src/dagster/history
      - dagster_compute_logs:/app/src/dagster/compute_logs
    command: poetry run dagster-daemon run

  dagster-webserver:
    build:
      context: .
    container_name: dagster-webserver
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "7778:3000"
    volumes:
      - dagster_history:/app/src/dagster/history
      - dagster_compute_logs:/app/src/dagster/compute_logs
    command: poetry run dagster-webserver -h 0.0.0.0 -p 3000

volumes:
  pgdata:
  dagster_history:
  dagster_compute_logs: