# ========================================
# DOCKER COMPOSE - OST AI ENGINE
# ========================================
services:
  postgres:
    image: postgres:latest
    container_name: ost-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "7777:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  dagster:
    build:
      context: .
    container_name: dagster
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "7778:3000"

volumes:
  pgdata: