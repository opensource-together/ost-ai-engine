version: '3.8'

services:
  # ============================================================================
  # MAIN APPLICATION (Dagster + DBT + Go Binaries)
  # ============================================================================
  ost-linker:
    build: .
    container_name: ost-linker-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Dagster UI
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/ost_db
      - DAGSTER_HOME=/app/dagster_home
      # GitHub Tokens for Scraper (Add to .env)
      - GITHUB_ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      # ML Config
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./dagster_home:/app/dagster_home
      # Mount source code for simpler dev loops (optional, remove for prod)
      - ./src:/app/src
      - ./dbt:/app/dbt
    depends_on:
      - db
    # Override command to ensure migrations or specific tailored startup if needed
    command: [ "dagster", "dev", "-h", "0.0.0.0", "-p", "3000" ]

  # ============================================================================
  # DATABASE (Postgres + PGVector)
  # ============================================================================
  db:
    image: ankane/pgvector:v0.4.1 # Used same version as pyproject.toml requirement
    container_name: ost-linker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ost_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Init scripts if needed
      # - ./scripts/init_db:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
