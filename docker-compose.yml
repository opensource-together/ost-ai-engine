# ========================================
# DOCKER COMPOSE - OST AI ENGINE
# ========================================
services:
  postgres:
    image: postgres:16
    container_name: ost-db
    env_file:
      - ./prisma/.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "7777:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dagster-daemon:
    build:
      context: .
    container_name: dagster-daemon
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./config/cfg.py:/app/config/cfg.py
      - ./config/cfg.yaml:/app/config/cfg.yaml
      # Mount the whole dagster package for code changes and local history/logs
      - ./src/:/app/src/
      # Dagster instance storage (matches src/pipeline/dagster.yaml base_dir)
      - ./.dagster_home:/app/.dagster_home
    command: ["dagster-daemon", "run"]

  dagster-webserver:
    build:
      context: .
    container_name: dagster-webserver
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "7778:3000"
    volumes:
      - ./config/cfg.py:/app/config/cfg.py
      - ./config/cfg.yaml:/app/config/cfg.yaml
      - ./src/:/app/src
      - ./.dagster_home:/app/.dagster_home
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000"]

volumes:
  pgdata: