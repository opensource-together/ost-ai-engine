############################################################
#  OST AI ENGINE - CENTRALIZED CONFIG (EXAMPLE)            #
#  This file is a sample centralized configuration          #
#  to copy and adapt for your environment.                 #
#  It contains all secrets and parameters required          #
#  for Go scrapers and the Dagster pipeline.               #
#                                                          #
#  DO NOT COMMIT WITH SENSITIVE VALUES!                    #
############################################################

# ───────────────────────────────────────────────────────── #
# PostgreSQL database connection URL
# Format: postgresql://user:pass@host:port/dbname
DATABASE_URL: postgresql://user:pass@host:port/dbname

# GitHub access token (create a token at https://github.com/settings/tokens)
GITHUB_ACCESS_TOKEN: your_github_token_here

# GitLab access token (create a token at https://gitlab.com/-/profile/personal_access_tokens)
GITLAB_ACCESS_TOKEN: your_gitlab_token_here

# GitHub scraping query (see GitHub Search API docs)
# Example: stars:>100 stars:<500 created:>=YYYY-MM-DD is:public archived:false
GITHUB_SCRAPING_QUERY: stars:>100 stars:<500 created:>=YYYY-MM-DD is:public archived:false

# Cron schedule for GitHub scraper Dagster job
GITHUB_SCRAPER_CRON: 0 */6 * * *

# Number of top GitHub projects to fetch (integer)
GITHUB_TOP_N: 30
# ───────────────────────────────────────────────────────── #
