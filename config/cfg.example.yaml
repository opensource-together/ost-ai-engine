############################################################
#  OST AI ENGINE - CENTRALIZED CONFIG (EXAMPLE)            #
#  This file is a sample centralized configuration          #
#  to copy and adapt for your environment.                 #
#  It contains all secrets and parameters required          #
#  for Go scrapers and the Dagster pipeline.               #
#                                                          #
#  DO NOT COMMIT WITH SENSITIVE VALUES!                    #
############################################################

# ───────────────────────────────────────────────────────── #

# PostgreSQL database connection URL

DATABASE_URL: "postgresql://user:pass@host:5432/dbname"


# # GitHub configuration

GITHUB_API_URL: https://api.github.com/search/repositories
GITHUB_ACCESS_TOKEN: "your_github_token_here"
# Example query matching the filters used in `config/cfg.py` (date should be updated as needed)
GITHUB_SCRAPING_QUERY: stars:XX..XXX topics:>XX forks:>XX created:>=X is:public archived:false
GITHUB_TOP_N: 30

# GitLab configuration

GITLAB_API_URL: https://gitlab.com/api/v4
GITLAB_ACCESS_TOKEN: "your_gitlab_token_here"
GITLAB_PROJECTS_VISIBILITY: public
GITLAB_PROJECTS_ARCHIVED: false
GITLAB_PROJECTS_ORDER_BY: created_at
GITLAB_PROJECTS_SORT: desc
GITLAB_SCRAPING_QUERY: opensource
GITLAB_TOP_N: 30

# ───────────────────────────────────────────────────────── #

# Optional model / seed paths used by the pipeline
FASTTEXT_MODEL_PATH: /app/models/lid.176.ftz
TECHSTACKS_SEED_PATH: /app/prisma/seed/techstacks-data.ts