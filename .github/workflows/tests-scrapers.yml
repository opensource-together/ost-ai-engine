name: tests-scrapers

on:
  push:
    branches: [ main, dev, ost* ]
    paths:
      - 'src/infrastructure/services/go/github/**'
      - 'src/infrastructure/services/go/gitlab/**'
      - '.github/workflows/tests-scrapers.yml'
      - '.env.example'
  pull_request:
    branches: [ main, dev, ost* ]
    paths:
      - 'src/infrastructure/services/go/github/**'
      - 'src/infrastructure/services/go/gitlab/**'
      - '.github/workflows/tests-scrapers.yml'
      - '.env.example'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    name: Go integration env checks
    runs-on: ubuntu-latest
    env:
      # Tokens (set in repo/org secrets)
      GITHUB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN_GITHUB }}
        # GITLAB_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN_GITLAB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Run GitHub scraper API health test
        working-directory: src/infrastructure/services/go/github
        run: go test -v -tags=integration -run 'TestGitHubAPIHealthy'
        # - name: Run GitLab scraper API health test
        #   working-directory: src/infrastructure/services/go/gitlab
        #   run: go test -v -tags=integration -run 'TestGitLabAPIHealthy'


