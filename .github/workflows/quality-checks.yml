name: Quality checks

# PRs run scoped checks from path filters; pushes (e.g. staging) always run everything.
on:
  workflow_call:
    secrets:
      OST_LINKER_SYNC_TOKEN:
        required: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # path-filter booleans ('true' / 'false' strings from dorny/paths-filter)
      python: ${{ steps.filter.outputs.python }}
      deps_py: ${{ steps.filter.outputs.deps_py }}
      workflows: ${{ steps.filter.outputs.workflows }}
      dbt: ${{ steps.filter.outputs.dbt }}
      go_svc: ${{ steps.filter.outputs.go_svc }}
      docker_pack: ${{ steps.filter.outputs.docker_pack }}
      prisma_schema: ${{ steps.filter.outputs.prisma_schema }}
      ost_docs_paths: ${{ steps.filter.outputs.ost_docs_paths }}
      dagster_cfg: ${{ steps.filter.outputs.dagster_cfg }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # PRs may need deeper history so path filter can resolve base refs
        with:
          fetch-depth: 0

      - name: Decide which slices run on this PR
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deps_py:
              - 'pyproject.toml'
              - 'uv.lock'
            workflows:
              - '.github/workflows/**'
            python:
              - 'src/**/*.py'
              - 'tests/**'
              - 'Makefile'
            dagster_cfg:
              - 'dagster.yaml'
              - 'dagster.prod.yaml'
              - 'workspace.yaml'
            dbt:
              - 'dbt/**'
              - '.sqlfluff'
            go_svc:
              - 'src/services/go/**'
            docker_pack:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-compose.override.yml'
              - 'scripts/init.sh'
              - 'scripts/docker-entrypoint.sh'
            prisma_schema:
              - 'prisma/**'
            ost_docs_paths:
              - 'ost-docs/**'
              - '.gitmodules'

  quality:
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.deps_py == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.dagster_cfg == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest -m unit --cov-fail-under=50

      - name: API tests
        run: uv run pytest -m api --no-cov

      - name: Dagster startup smoke test
        env:
          DAGSTER_HOME: ${{ github.workspace }}
          DAGSTER_STORAGE_DIR: ${{ github.workspace }}/tmp_dagster/storage
          DAGSTER_LOGS_DIR: ${{ github.workspace }}/tmp_dagster/logs
        run: |
          mkdir -p "$DAGSTER_STORAGE_DIR" "$DAGSTER_LOGS_DIR"
          uv run pytest -m integration -k test_dagster_startup --no-cov

  dbt-check:
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: dbt parse
        run: |
          cd dbt
          uv run dbt deps
          uv run dbt parse

  go-check:
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.go_svc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet, build and test scraper
        run: |
          cd src/services/go/scraper
          go vet ./...
          go build -o /dev/null .
          go test ./...

      - name: Vet, build and test fetcher
        run: |
          cd src/services/go/fetcher
          go vet ./...
          go build -o /dev/null .
          go test ./...

      - name: Vet, build and test trending
        run: |
          cd src/services/go/trending
          go vet ./...
          go build -o /dev/null .
          go test ./...

  docker-build:
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.docker_pack == 'true'
      || needs.changes.outputs.deps_py == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.dbt == 'true'
      || needs.changes.outputs.go_svc == 'true'
      || needs.changes.outputs.prisma_schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prisma-validate:
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.prisma_schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://validate:validate@localhost:5432/validate"

  security:
    needs: changes
    if: >-
      github.event_name == 'push'
      || needs.changes.outputs.workflows == 'true'
      || needs.changes.outputs.deps_py == 'true'
      || needs.changes.outputs.python == 'true'
      || needs.changes.outputs.go_svc == 'true'
      || needs.changes.outputs.prisma_schema == 'true'
      || needs.changes.outputs.docker_pack == 'true'
      || needs.changes.outputs.dbt == 'true'
      || needs.changes.outputs.ost_docs_paths == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Dependency audit
        run: uv run pip-audit

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Secret leak scan
        run: gitleaks detect --source . --no-git --verbose

  docs-submodule:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (
        github.event_name == 'push'
        || needs.changes.outputs.workflows == 'true'
        || needs.changes.outputs.ost_docs_paths == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.OST_LINKER_SYNC_TOKEN }}

      - name: Check docs submodule SHA exists on remote
        run: |
          SUBMODULE_SHA=$(git -C ost-docs rev-parse HEAD)
          echo "Submodule SHA: $SUBMODULE_SHA"
          if git ls-remote https://x-access-token:${{ secrets.OST_LINKER_SYNC_TOKEN }}@github.com/opensource-together/ost-docs.git | grep -q "$SUBMODULE_SHA"; then
            echo "docs submodule SHA exists on ost-docs remote"
          else
            echo "::error::docs submodule points to $SUBMODULE_SHA which does not exist on ost-docs remote"
            echo "Make sure your submodule commits are pushed to ost-docs"
            exit 1
          fi
