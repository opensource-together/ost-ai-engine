name: Quality checks

on:
  workflow_call:
    secrets:
      OST_DOCS_TOKEN:
        required: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest -m unit

  dbt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: SQLFluff lint
        run: uv run sqlfluff lint dbt/models/

      - name: dbt parse
        run: |
          cd dbt
          uv run dbt deps
          uv run dbt parse

  docs-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.OST_DOCS_TOKEN }}

      - name: Check docs submodule SHA exists on remote
        run: |
          SUBMODULE_SHA=$(git -C docs rev-parse HEAD)
          echo "Submodule SHA: $SUBMODULE_SHA"
          if git ls-remote https://x-access-token:${{ secrets.OST_DOCS_TOKEN }}@github.com/opensource-together/ost-docs.git | grep -q "$SUBMODULE_SHA"; then
            echo "docs submodule SHA exists on ost-docs remote"
          else
            echo "::error::docs submodule points to $SUBMODULE_SHA which does not exist on ost-docs remote"
            echo "Make sure your submodule commits are pushed to ost-docs"
            exit 1
          fi
