name: CI

on:
  pull_request:
    branches: [develop, main, staging]
  push:
    branches: [develop, main, staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.4.1
        env:
          POSTGRES_USER: linker_ci
          POSTGRES_PASSWORD: linker_ci
          POSTGRES_DB: linker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linker_ci -d linker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://linker_ci:linker_ci@localhost:5432/linker_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: linker_ci
      POSTGRES_PASSWORD: linker_ci
      POSTGRES_DB: linker_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: uv run sqlfluff fix dbt/models/ --force
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/
      - run: uv run sqlfluff lint dbt/models/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run mypy src/

  unit:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -x --cov=src --cov-fail-under=80
      - name: Dagster startup smoke test
        env:
          DAGSTER_HOME: ${{ github.workspace }}
          DAGSTER_STORAGE_DIR: ${{ github.workspace }}/tmp_dagster/storage
          DAGSTER_LOGS_DIR: ${{ github.workspace }}/tmp_dagster/logs
        run: |
          mkdir -p "$DAGSTER_STORAGE_DIR" "$DAGSTER_LOGS_DIR"
          uv run pytest -m integration -k test_dagster_startup --no-cov

  dbt-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.4.1
        env:
          POSTGRES_USER: linker_ci
          POSTGRES_PASSWORD: linker_ci
          POSTGRES_DB: linker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linker_ci -d linker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://linker_ci:linker_ci@localhost:5432/linker_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: linker_ci
      POSTGRES_PASSWORD: linker_ci
      POSTGRES_DB: linker_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: |
          cd dbt
          uv run dbt deps
          uv run dbt build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: |
          cd src/services/go/scraper && go vet ./... && go test ./...
          cd ../fetcher && go vet ./... && go test ./...
          cd ../trending && go vet ./... && go test ./...

  integration-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.4.1
        env:
          POSTGRES_USER: linker_ci
          POSTGRES_PASSWORD: linker_ci
          POSTGRES_DB: linker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linker_ci -d linker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://linker_ci:linker_ci@localhost:5432/linker_ci
      LINKER_SKIP_SEMANTIC_INIT: "true"
      OST_LINKER_REQUIRE_SERVICE_TOKEN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: ./node_modules/.bin/ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed/seed.ts
      - run: uv run pytest tests/integration/api --no-cov -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pip-audit
