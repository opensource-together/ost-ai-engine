name: Publish develop

on:
  pull_request:
    branches: [ main, staging ]
  push:
    branches:
      - staging

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install

      - name: Lint
        run: poetry run ruff check src/

      - name: Type check
        run: poetry run mypy src/

      - name: Unit tests
        run: poetry run pytest -m unit

  dbt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt + sqlfluff
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-core dbt-postgres

      - name: SQLFluff lint
        run: sqlfluff lint dbt/models/

      - name: dbt parse
        run: |
          cd dbt
          dbt deps
          dbt parse

  build:
    runs-on: ubuntu-latest
    needs: [quality, dbt-check]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.OST_RELEASE_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/opensource-together/ia
          tags: |
            type=sha
            type=raw,value=develop

      - name: Upload server artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
