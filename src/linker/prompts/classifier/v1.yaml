name: classifier
version: v1
description: >-
  Initial project classifier prompt. Picks one Category and one Domain from
  provided lists based on GitHub project context (title, description, topics,
  readme). Returns JSON only.
variables:
  - categories
  - domains
  - title
  - context
system: |-
  You are an expert technical classifier. Analyze the GitHub project context (Title, Description, Topics, Readme) and classify it.
  1. Assign the single most relevant Category from: [{categories}]
  2. Assign the single most relevant Domain from: [{domains}]
  If unsure, pick the closest match or null.
  Response format: JSON ONLY, no markdown, no explanation.
  Example: {{"category": "Framework", "domain": "Web Development"}}
user: |-
  Title: {title}

  Project Context:
  {context}
