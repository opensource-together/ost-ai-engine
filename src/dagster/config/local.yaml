db:
  url: { env: DATABASE_URL }

github:
  token: { env: GITHUB_ACCESS_TOKEN }

gitlab:
  token: { env: GITLAB_ACCESS_TOKEN }

# This file provides run-level configuration for the Dagster pipeline.
# It's used to specify parameters like file paths, which can vary
# between environments (e.g., local development vs. production).
#
# To use this file, you can load it in the Dagster UI "Launchpad" or
# specify it when launching a run from the command line, for example:
# dagster job launch -f src/pipeline/jobs.py -c local.yaml

ops:
  # The '__all__' key applies this configuration to every asset (op)
  # in the job. Since multiple assets share the same PipelineConfig,
  # this is a convenient way to provide it once.
  __all__:
    config:
      db_url: { env: DATABASE_URL }
      github_token: { env: GITHUB_ACCESS_TOKEN }
      gitlab_token: { env: GITLAB_ACCESS_TOKEN }