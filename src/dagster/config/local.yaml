# ========================================
# DAGSTER PIPELINE CONFIGURATION
# ========================================
# This file provides run-level configuration for the Dagster pipeline.
# It's used to specify parameters like file paths, which can vary
# between environments (e.g., local development vs. production).
#
# To use this file, you can load it in the Dagster UI "Launchpad" or
# specify it when launching a run from the command line, for example:
# dagster job launch -f src/pipeline/jobs.py -c local.yaml

ops:
  github_scraper_asset:
    config:
      env_file: ".env.local"