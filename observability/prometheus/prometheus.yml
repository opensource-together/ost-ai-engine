global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: linker-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: docker-stats
    metrics_path: /
    static_configs:
      - targets: ["docker-stats:9487"]
