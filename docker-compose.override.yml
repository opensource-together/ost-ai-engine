# Dev overrides — automatically loaded by `docker compose up`
# Adds a local Postgres container and mounts local SQLite dagster.yaml.
# In staging/prod, use `docker compose -f docker-compose.yml up` to skip this file.
services:
  webserver:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Dev override: mount local SQLite dagster.yaml over the prod Postgres config
      - ./dagster.yaml:/app/dagster_home/dagster.yaml
      # Dev override: bind-mount source code for live reload
      - ./src:/app/src
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  daemon:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./dagster.yaml:/app/dagster_home/dagster.yaml
      # Dev override: bind-mount source code for live reload
      - ./src:/app/src
      - ./dbt:/app/dbt
      - ./scripts:/app/scripts

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ost-linker-prometheus
    restart: unless-stopped
    labels:
      org.open-source-together.stack: ost
      org.open-source-together.app: linker
      org.open-source-together.role: prometheus
      org.open-source-together.description: Prometheus scrape and alert rules
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      api:
        condition: service_healthy
      docker-stats:
        condition: service_started

  docker-stats:
    image: wywywywy/docker_stats_exporter@sha256:1e56d63987bbb10fc78ccca97a388e14696e305f52738a1f063e54f04cea779b
    container_name: ost-linker-docker-stats
    restart: unless-stopped
    labels:
      org.open-source-together.stack: ost
      org.open-source-together.app: linker
      org.open-source-together.role: docker-stats
      org.open-source-together.description: Container CPU and memory via Docker stats API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ost-linker-grafana
    restart: unless-stopped
    labels:
      org.open-source-together.stack: ost
      org.open-source-together.app: linker
      org.open-source-together.role: grafana
      org.open-source-together.description: Grafana dashboards for Linker API and containers
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ============================================================================
  # DATABASE (Postgres + PGVector) — dev only
  # ============================================================================
  db:
    image: ankane/pgvector:v0.4.1
    container_name: ost-linker-db
    restart: unless-stopped
    labels:
      org.open-source-together.stack: ost
      org.open-source-together.app: linker
      org.open-source-together.role: postgres
      org.open-source-together.description: Linker dev Postgres + pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Default: loopback only (POSTGRES_BIND_ADDR=127.0.0.1). Set POSTGRES_BIND_ADDR=0.0.0.0 for LAN/Tailscale (trusted networks only). Use a strong POSTGRES_PASSWORD.
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
