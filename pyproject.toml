
[project]
name = "ost-linker"
version = "1.0.0"
description = "Recommender-system of OST, AI powered."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    {name = "spideyai_X", email = "dhicham.pro@gmail.com"},
]
license = {text = "CC-BY-NC-4.0"}
keywords = ["open-source", "recommendation-engine", "dagster", "dbt", "pgvector", "llm"]
dependencies = [
    "sqlalchemy>=2.0.41,<3",
    "psycopg2-binary>=2.9.10,<3",
    "pandas>=2.3.0,<3",
    "pydantic-settings>=2.4.0,<3",
    "numpy<2.0",
    "pydantic>=2.0.0,<3",
    "pgvector>=0.4.1,<0.5",
    "python-dotenv>=1.1.1,<2",
    "requests>=2.31.0,<3",
    "dagster>=1.12.17,<2",
    "dagster-webserver>=1.12.17,<2",
    "dagster-postgres>=0.28.17,<0.29",
    "PyGithub>=2.6.1,<3",
    "furo>=2025.9.25",
    "dotenv>=0.9.9,<0.10",
    "schedule>=1.1.0,<2",
    "fasttext>=0.9.3,<0.10",
    "fasttext-wheel>=0.9.2,<0.10",
    "mistralai>=1.5.0,<2",
    "sentence-transformers>=5.1.2,<6",
    "torch>=2.6.0,<3",
    "dagster-dbt>=0.28.17,<0.29",
    "dbt-core>=1.8.0,<2",
    "dbt-postgres>=1.8.0,<2",
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "slowapi>=0.1.9,<0.2",
]

[project.urls]
Homepage = "https://opensource-together.com/"
Repository = "https://github.com/opensource-together/ost-linker"
Issues = "https://github.com/opensource-together/ost-linker/issues"

[dependency-groups]
dev = [
    "ruff>=0.12.0,<0.13",
    "pytest>=8.4.1,<9",
    "pytest-cov>=6.0.0,<7",
    "pytest-dotenv>=0.5.2,<0.6",
    "faker>=26.0.0,<27",
    "httpx>=0.28.1,<0.29",
    "bandit>=1.8.6,<2",
    "mypy>=1.8.0,<2",
    "safety>=2.3.0,<3",
    "sqlfluff>=3.0,<4",
    "sqlfluff-templater-dbt>=3.0,<4",
    "pip-audit>=2.7.0,<3",
    "pandas-stubs>=3.0.0.260204",
    "types-psycopg2>=2.9.21.20260223",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.dagster]
module_name = "src.linker.definitions"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "venv",
]

[tool.ruff.lint]
select = [
    "F",  # Pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort (import sorting)
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"src/linker/definitions.py" = ["E402"]
"src/services/api/routes/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
known-third-party = ["dagster", "dagster_dbt", "dagster_postgres"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "api: API tests",
]
