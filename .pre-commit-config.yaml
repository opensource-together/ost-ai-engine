# Requires: uv sync (dev group). Install hooks: uv run pre-commit install
# Mirrors the Python steps in .github/workflows/quality-checks.yml (quality job).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        pass_filenames: false
